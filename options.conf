####################################################################
# locklet options (oneinstack-style)
# 值可被 install.sh 命令行参数覆盖, 例如:
#   ./install.sh --source --nginx-version 1.31.9 --nginx-module "stub_status,http_v3"
####################################################################

# ---------- 安装模式 ----------
# deb    = nginx.org 官方 deb 包 (默认, stable 通道, apt 自动升级)
# source = 源码编译 (最小化参数+加固; ./install.sh --source 或 --nginx-version 触发)
install_mode=deb
# deb 模式的仓库通道: stable | mainline
nginx_channel=stable
# 每周日 04:30 自动升级 timer (deb: apt 跟随仓库; source: 检测新版自动重编)
auto_upgrade=y

# ---------- 源码版本 (source 模式) ----------
nginx_version=1.31.9
pcre2_version=10.49
zlib_version=1.4
openssl_version=3.5.4
lego_version=5.6.0
headers_more_version=0.42

# ---------- 加固编译选项 (对齐 nginx.org 官方 Debian 包) ----------
# 栈保护 + 格式化字符串检查 + FORTIFY + PIC
nginx_cc_opt="-O2 -fstack-protector-strong -Wformat -Werror=format-security -D_FORTIFY_SOURCE=2 -fPIC"
# RELRO + BIND_NOW(full RELRO) + --as-needed + PIE(ASLR)
nginx_ld_opt="-Wl,-z,relro -Wl,-z,now -Wl,--as-needed -pie"

# ---------- 路径 ----------
# source 模式与 oneinstack 保持一致: /usr/local/nginx, /data/wwwroot, /data/wwwlogs
# deb 模式跟随官方包布局: /usr/sbin/nginx, /etc/nginx (conf.d 为 vhost 目录)
# 以下 *_dir 变量由 install.sh 按模式自动回写, 一般无需手工修改
nginx_prefix=/usr/local/nginx
nginx_sbin=/usr/local/nginx/sbin/nginx
nginx_conf=/usr/local/nginx/conf
nginx_vhost_dir=/usr/local/nginx/conf/vhost
nginx_ssl_dir=/usr/local/nginx/conf/ssl
nginx_rewrite_dir=/usr/local/nginx/conf/rewrite
wwwroot_dir=/data/wwwroot
wwwlogs_dir=/data/wwwlogs

# ---------- 运行账户 ----------
www_user=www
www_group=www

# ---------- 可选编译模块 (source 模式) ----------
# 可选: stub_status http_v3 sub_module headers_more brotli (逗号分隔)
#   stub_status   -> --with-http_stub_status_module
#   http_v3       -> --with-http_v3_module (QUIC/HTTP3)
#   sub_module    -> --with-http_sub_module
#   headers_more  -> --add-module=headers-more-nginx-module
#   brotli        -> --add-module=ngx_brotli (需要 git)
nginx_modules=""

# ---------- 下载加速镜像 ----------
# 留空使用官方源; 例如: https://mirror.ghproxy.com/ (仅作用于 github.com 下载)
github_mirror=""

# ---------- ACME 默认值 (vhost.sh 使用) ----------
default_email=""

# ---------- 运行时记录 (自动回写, 勿手改) ----------
locklet_dir=""
