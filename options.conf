####################################################################
# locklet options (oneinstack-style)
# 值可被 install.sh 命令行参数覆盖, 例如:
#   ./install.sh --nginx-version 1.31.9 --nginx-module "stub_status,http_v3"
####################################################################

# ---------- 源码版本 ----------
nginx_version=1.31.9
pcre2_version=10.49
zlib_version=1.4
openssl_version=3.5.4
lego_version=5.6.0
headers_more_version=0.42

# ---------- 加固编译选项 (对齐 nginx.org 官方 Debian 包) ----------
# 栈保护 + 格式化字符串检查 + FORTIFY + PIC
nginx_cc_opt="-O2 -fstack-protector-strong -Wformat -Werror=format-security -D_FORTIFY_SOURCE=2 -fPIC"
# RELRO + BIND_NOW(full RELRO) + --as-needed + PIE(ASLR)
nginx_ld_opt="-Wl,-z,relro -Wl,-z,now -Wl,--as-needed -pie"

# ---------- 路径 (与 oneinstack 保持一致) ----------
nginx_prefix=/usr/local/nginx
wwwroot_dir=/data/wwwroot
wwwlogs_dir=/data/wwwlogs

# ---------- 运行账户 ----------
www_user=www
www_group=www

# ---------- 可选编译模块 ----------
# 可选: stub_status http_v3 sub_module headers_more brotli (逗号分隔)
#   stub_status   -> --with-http_stub_status_module
#   http_v3       -> --with-http_v3_module (QUIC/HTTP3)
#   sub_module    -> --with-http_sub_module
#   headers_more  -> --add-module=headers-more-nginx-module
#   brotli        -> --add-module=ngx_brotli (需要 git)
nginx_modules=""

# ---------- 下载加速镜像 ----------
# 留空使用官方源; 例如: https://mirror.ghproxy.com/ (仅作用于 github.com 下载)
github_mirror=""

# ---------- ACME 默认值 (vhost.sh 使用) ----------
default_email=""
